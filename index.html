async function open(code){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(code)),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.i)},key,ub(P.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function mount(a){
  const st=document.createElement('style');st.textContent=a.css;document.head.appendChild(st);
  document.getElementById('lock').remove();
  const app=document.getElementById('app');app.innerHTML=a.html;app.hidden=false;
  const sc=document.createElement('script');sc.textContent=a.js;document.body.appendChild(sc);
}
async function tryCode(code,remember){
  const msg=document.getElementById('lkMsg'),btn=document.getElementById('lkBtn');
  msg.textContent='';btn.disabled=true;btn.textContent='Wird geöffnet …';
  try{const a=await open(code);try{if(remember)localStorage.setItem(K,code);else localStorage.removeItem(K)}catch(e){}mount(a);return true}
  catch(e){btn.disabled=false;btn.textContent='Öffnen / Open';
    msg.textContent=(window.crypto&&crypto.subtle)?'Zugangscode falsch. / Wrong access code.':'Dieser Browser kann das Formular nicht entschlüsseln. Bitte Safari oder Chrome in aktueller Version nutzen.';
    try{localStorage.removeItem(K)}catch(e){}return false}
}
document.getElementById('lock').addEventListener('submit',e=>{e.preventDefault();const c=document.getElementById('lkCode').value;if(c.trim())tryCode(c,document.getElementById('lkRem').checked)});
let saved=null;try{saved=localStorage.getItem(K)}catch(e){}
if(saved)tryCode(saved,true);
})();
